[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maxed-mcp"
version = "0.1.0"
description = "Model Context Protocol server that fronts the open-source accounting suite's deterministic tools: bank-statement and OFX parsing, document classification, workpaper-spec validation, exact money math, and webhook HMAC verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "maxed-mcp contributors" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "agent",
  "ai",
  "accounting",
  "bookkeeping",
  "fintech",
  "tools",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "mcp>=1.2,<2",
]

[project.optional-dependencies]
# The Python sibling tools the shell-backed MCP tools front. Installing these
# makes normalize_bank_statement and classify_document available out of the box.
suite = [
  "statement-normalizer>=0.1,<1.0",
  "doc-classifier-kit>=0.1,<1.0",
]
dev = [
  "pytest>=7.4",
]

[project.scripts]
maxed-mcp = "maxed_mcp.server:main"

[project.urls]
Homepage = "https://github.com/maxed-oss/maxed-mcp"
Source = "https://github.com/maxed-oss/maxed-mcp"
Issues = "https://github.com/maxed-oss/maxed-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/maxed_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
